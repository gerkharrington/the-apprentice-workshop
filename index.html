<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Apprentice Workshop</title>

  <meta property="og:title" content="⚒️ The Apprentice Workshop" />
  <meta property="og:description"
    content="A site for creating custom The Grandest Party content. Create & export custom roles with an easy-to-use, all-in-one tool!" />
  <meta property="og:image"
    content="https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/favicon.png?raw=true" />
  <meta property="og:url" content="https://gerkharrington.github.io/the-apprentice-workshop/" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/x-icon"
    href="https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/favicon.png?raw=true">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <style>
    /* -------------------[ Palette ]------------------- */
    :root {

      --type_prompt: #ffffff;
      --type_item: #ffffff;
      --type_guest: #f8e71c;
      --type_stranger: #bb11ee;
      --type_spirit: #abddff;

      --type_prompt_dark: #777777;
      --type_item_dark: #777777;
      --type_guest_dark: #b1a414;
      --type_stranger_dark: #7e0ba1;
      --type_spirit_dark: #668498;

      --black: #000000;
      --very_dark_grey: #181818;
      --dark_grey: #333333;
      --light_grey: var(--type_prompt_dark);
      --white: var(--type_prompt);
      --red: #7a0a0a;
      --light_red: #ae0e0e;

      --radius_main: 8px;
      --radius_border: 2px;

      --size_large: 32px;
      --size_small: 16px;

      --margin_small: 6px;
      --margin_main: 10px;
      --margin_large: 16px;

      --padding_main: 10px;

      --shrink: 0.96;

      --transition_short: 0.2s ease;
      --transition_long: 0.8s ease-out;

      /* This one will change based on which role is selected */
      --type_selected: var(--type_guest);
      --type_selected_dark: var(--type_guest_dark);
    }

    /* -------------------[ Keyframe Animations ]------------------- */
    @keyframes animation_blur_in {
      from {
        opacity: 0;
        filter: blur(6px);
        transform: scale(1.01);
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    @keyframes animation_slide_right {
      from {
        transform: translateX(-20px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes animation_slide_up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes animation_fade_in {
      from {
        transform: rotateY(90deg) scale(0.5);
        opacity: 0;
      }

      to {
        transform: rotateY(0deg) scale(1);
        opacity: 1;
      }
    }

    /* -------------------[ Default Styles ]------------------- */
    /* Include padding & border in element sizing for everything */
    * {
      box-sizing: border-box;
    }

    /* Grey things out if disabled */
    *:disabled,
    *.disabled {
      opacity: 0.33;
      cursor: not-allowed;
      user-select: none;
    }

    /* Stop useless highlighting */
    select,
    img,
    button,
    footer,
    span,
    h2 {
      user-select: none;
    }

    /* Body text */
    body {
      margin: 0;
      display: flex;
      min-height: 100dvh;
      height: 100dvh;
      font-family: sans-serif;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      animation: animation_blur_in var(--transition_long);
    }

    input,
    textarea,
    select {
      width: 100%;
      resize: none;
      background: var(--very_dark_grey);
      border: var(--radius_border) solid var(--dark_grey);
      border-radius: var(--radius_main);
      padding: var(--padding_main);
      color: var(--white);
      outline: none;
      transition: var(--transition_short);
    }

    select {
      min-width: 250px;
      max-width: 250px;
      height: 50px;
    }

    input:focus,
    textarea:focus {
      border-color: var(--type_selected);
      box-shadow: 0 0 0 var(--radius_border) var(--type_selected_dark);
      transform: translateY(-1px);
    }

    input,
    textarea,
    select,
    button {
      font-family: inherit;
      font-size: var(--size_small);
    }

    /* Header text */
    h2 {
      margin: 0 0 var(--margin_large) 0;
      font-size: var(--size_large);
      line-height: 1.2;
      color: var(--white);
    }

    /* -------------------[ Hidden Elements ]------------------- */
    .hidden {
      display: none !important;
    }

    /* Hidden, but still "there" for screen reader accessibility */
    .fake_hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      border: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
    }

    /* -------------------[ Sidebar Style ]------------------- */
    .sidebar_main {
      width: 250px;
      background: var(--very_dark_grey);
      color: var(--white);
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: var(--radius_border) solid var(--dark_grey);
      animation: animation_slide_right var(--transition_long);
    }

    .sidebar_list {
      flex: 1;
      overflow-y: auto;
      margin-top: var(--margin_main);
    }

    .sidebar_entry {
      user-select: none;
      display: flex;
      cursor: pointer;
      align-items: center;
      gap: 10px;
      padding: 8px var(--padding_main);
      margin-bottom: var(--margin_small);
      border-radius: var(--radius_main);
      position: relative;
      overflow: hidden;
      z-index: 0;
      max-height: 60px;
      transition: transform var(--transition_short), opacity var(--transition_short), filter var(--transition_short), background var(--transition_short);
    }

    /* This puts everything above the coloured gradient when you hover over and select a role by increasing its z-index */
    /* The sidebar_delete element is at a z-index above this, so it's in front (priority for clicking) */
    .sidebar_entry>* {
      position: relative;
      z-index: 1;
    }

    .sidebar_entry:hover {
      background: var(--dark_grey);
    }

    .sidebar_entry:active {
      transform: scale(var(--shrink));
    }

    .sidebar_entry.selected {
      padding-left: 6px;
      box-shadow: inset 0 0 0 2px var(--dark_grey);
    }

    .sidebar_entry.sidebar_type_prompt.selected {
      border-left: 6px solid var(--type_prompt);
    }

    .sidebar_entry.sidebar_type_item.selected {
      border-left: 6px solid var(--type_item);
    }

    .sidebar_entry.sidebar_type_guest.selected {
      border-left: 6px solid var(--type_guest);
    }

    .sidebar_entry.sidebar_type_stranger.selected {
      border-left: 6px solid var(--type_stranger);
    }

    .sidebar_entry.sidebar_type_spirit.selected {
      border-left: 6px solid var(--type_spirit);
    }

    .sidebar_entry.removing {
      opacity: 0;
      transform: translateX(-20px) scale(var(--shrink));
      filter: blur(4px);
      transition: opacity var(--transition_short), transform var(--transition_short), filter var(--transition_short);
    }

    .sidebar_entry::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition_short);
      z-index: 0;
    }

    .sidebar_entry:hover::before {
      opacity: 0.18;
    }

    .sidebar_entry.selected::before {
      opacity: 0.18;
    }

    .sidebar_type_prompt::before {
      background: linear-gradient(45deg, var(--type_prompt), transparent);
    }

    .sidebar_type_item::before {
      background: linear-gradient(45deg, var(--type_item), transparent);
    }

    .sidebar_type_guest::before {
      background: linear-gradient(45deg, var(--type_guest), transparent);
    }

    .sidebar_type_stranger::before {
      background: linear-gradient(45deg, var(--type_stranger), transparent);
    }

    .sidebar_type_spirit::before {
      background: linear-gradient(45deg, var(--type_spirit), transparent);
    }

    .sidebar_add {
      margin: var(--margin_small) 0;
      padding: 5px var(--padding_main);
      cursor: pointer;
      border: none;
      background: var(--dark_grey);
      color: var(--white);
      border-radius: var(--radius_main);
      transition: background var(--transition_short), transform var(--transition_short);
    }

    .sidebar_add:hover {
      background: var(--light_grey);
      transform: translateY(-1px);
    }

    .sidebar_add:active {
      transform: scale(var(--shrink));
    }

    .sidebar_delete {
      margin: 0;
      padding: 2px var(--padding_main);
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      border: none;
      border-radius: var(--radius_main);
      transition: transform var(--transition_short), background var(--transition_short);
      /* It's important the z-index is above everything else in the sidebar entry */
      z-index: 2;
    }

    .sidebar_delete:active {
      transform: scale(var(--shrink));
    }

    .sidebar_delete:hover {
      background: var(--light_red);
    }

    .sidebar_container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      min-width: 0;
    }

    .sidebar_name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    .sidebar_icon {
      width: 24px;
      height: 24px;
      object-fit: cover;
      flex: 0 0 auto;

    }

    .sidebar_list::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar_list::-webkit-scrollbar-thumb {
      background: var(--dark_grey);
      border-radius: var(--radius_main);
    }

    .sidebar_type {
      font-size: var(--size_small);
      text-transform: uppercase;
      color: var(--light_grey);
      margin: var(--margin_large) 0 var(--margin_main) 4px;
      letter-spacing: 1px;
      cursor: pointer;
      user-select: none;
      transition: opacity var(--transition_short);
    }

    .sidebar_type:hover {
      opacity: 0.5;
    }

    .sidebar_type .arrow {
      display: inline-block;
      width: var(--size_small);
      text-align: center;
      transition: transform var(--transition_short);
    }

    .sidebar_type .arrow.collapsed {
      transform: rotate(-90deg);
    }

    .sidebar_io_row {
      display: flex;
      gap: var(--margin_small);
    }

    .sidebar_io_row button {
      flex: 1;
    }

    /* -------------------[ Editor Style ]------------------- */
    .editor_main {
      flex: 1;
      padding: 20px;
      animation: animation_slide_up var(--transition_long);
    }

    .editor_button {
      margin: var(--margin_small) 0;
      padding: 5px var(--padding_main);
      cursor: pointer;
      border: none;
      background: var(--dark_grey);
      color: var(--white);
      border-radius: var(--radius_main);
      transition: background var(--transition_short), transform var(--transition_short);
      height: 50px;
      width: 250px;
    }

    .editor_button:hover {
      background: var(--light_grey);
      transform: translateY(-1px);
    }

    .editor_button:active {
      transform: scale(var(--shrink));
    }

    .editor_button.on {
      background: var(--type_selected);
      color: var(--black);
    }

    .editor_empty {
      margin: var(--margin_small) 0;
      padding: var(--padding_main) var(--padding_main);
    }

    .editor_input {
      height: 100px;
      margin-bottom: var(--margin_main);
    }

    .editor_input_name {
      height: 50px;
      margin-bottom: 0;
    }

    .editor_input_toplabel {
      height: 50px;
      margin-bottom: var(--margin_small);
    }

    .editor_input_activate {
      height: 50px;
      width: 250px;
      margin-bottom: 0;
    }

    .editor_input_top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--margin_main);
    }

    .editor_icon_upload {
      flex: 0 0 117px;
      width: 117px;
      height: 117px;
      position: relative;
      cursor: pointer;
      border: 8px dashed var(--dark_grey);
      border-radius: var(--radius_main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition_short), box-shadow var(--transition_short);
    }

    .editor_icon_upload:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px var(--black);
    }

    .editor_icon_upload.has_icon {
      border: none;
    }

    .editor_icon_placeholder {
      font-size: 100px;
      color: var(--light_grey);
      user-select: none;
      line-height: 1;
      display: block;
      /* A manual offset to the height to fix fonts being weird and lower or higher than usual */
      transform: translateY(-8px);
    }

    .editor_icon_preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      animation: animation_fade_in var(--transition_short);
    }

    .editor_input_top_right {
      display: flex;
      flex-direction: column;
      gap: var(--margin_small);
      flex: 1;
    }

    .editor_input_top_right_top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .editor_format {
      width: auto;
      min-width: 250px;
    }

    .editor_input_top_right_bottom {
      display: flex;
      gap: var(--margin_small);
    }

    .editor_input_bottom {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--margin_main);
    }

    .editor_ability_icon {
      width: 50px;
      height: 50px;
    }

    .editor_ability_icon_preview {
      width: 50px;
      height: 50px;
      object-fit: contain;
      flex: 0 0 auto;
      transition: var(--transition_short);
    }

    .editor_footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      color: var(--dark_grey);
      font-size: var(--size_small);
      text-align: right;
      pointer-events: none;
      /* Keeps this in front of everything */
      z-index: 9999;
    }

    .editor_input_bottom_bottom {
      display: flex;
      align-items: center;
      gap: var(--margin_main);
      margin-bottom: var(--margin_main);
    }

    .editor_tag {
      display: inline-flex;
      align-items: center;
      gap: var(--margin_main);
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .editor_tag_icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex: 0 0 auto;
      opacity: 0.33;
      transition: opacity var(--transition_short), filter var(--transition_short), transform var(--transition_short);
    }

    .editor_tag input[type="checkbox"]:checked+.editor_tag_icon {
      opacity: 1;
    }

    .editor_tag span {
      color: var(--light_grey);
      transition: color var(--transition_short);
    }

    .editor_tag input[type="checkbox"]:checked~span {
      color: var(--white);
    }
  </style>

</head>

<body>

  <aside class="sidebar_main">
    <!-- Header text -->
    <h2>Roles</h2>
    <!-- The sidebar list itself -->
    <div id="sidebar_list" class="sidebar_list"></div>
    <!-- Add role button -->
    <button id="sidebar_add" class="sidebar_add">+ Add Role / Card</button>
    <!-- Save button -->
    <button id="sidebar_save" class="sidebar_add">Save</button>
    <!-- The import / export row -->
    <div class="sidebar_io_row">
      <button id="sidebar_import" class="sidebar_add">Import</button>
      <button id="sidebar_export" class="sidebar_add">Export</button>
    </div>
    <!-- Hidden file input for importing JSONs -->
    <input id="sidebar_import_file" type="file" accept="application/json" class="fake_hidden">
  </aside>

  <main class="editor_main">
    <h2>The Apprentice Workshop</h2>

    <p id="editor_empty" class="editor_empty">Click "Add Role" to begin workshopping!</p>

    <div id="editor_input" class="hidden">

      <!-- Role Icon Input (Only For Screen Readers) -->
      <input id="single_role_icon" class="fake_hidden" type="file" accept="image/*">

      <div class="editor_input_top">

        <!-- Role Icon Preview & Clickable Area -->
        <div id="editor_icon_upload" class="editor_icon_upload">
          <img id="editor_icon_preview" class="editor_icon_preview" alt="Selected role icon">
          <span id="editor_icon_placeholder" class="editor_icon_placeholder">+</span>
        </div>

        <!-- Right Side (Next To Icon Upload)-->
        <div class="editor_input_top_right">

          <!-- Right Side - Top Row -->
          <div class="editor_input_top_right_top">
            <!-- Role Icon Formatting Toggle -->
            <button id="single_role_format" class="editor_format editor_button">Format Icon</button>
          </div>

          <!-- Right Side - Bottom Row -->
          <div class="editor_input_top_right_bottom">
            <!-- Role Name Input -->
            <label for="single_role_name" class="fake_hidden">Role Name Input</label>
            <input id="single_role_name" class="editor_input_name" placeholder="Untitled" type="text">
            <!-- Role Type Input -->
            <select id="single_role_type">
              <option value="Guest">Guest</option>
              <option value="Stranger">Stranger</option>
              <option value="Spirit">Spirit</option>
              <option value="Item">Item</option>
              <option value="Prompt">Prompt</option>
            </select>
          </div>

        </div>

      </div>

      <textarea id="single_role_toplabel" class="editor_input_toplabel" placeholder="Win Condition / Prompt Card Label"></textarea>

      <!-- Ability Inputs -->
      <!-- Ability 1 -->
      <div class="editor_input_bottom">
        <select id="single_role_ability1_type" class="editor_ability_icon"></select>
        <img id="single_role_ability1_icon" class="editor_ability_icon_preview">
        <textarea id="single_role_ability1_name" class="editor_input_name" placeholder="1st Ability Name"></textarea>
      </div>
      <textarea id="single_role_ability1" class="editor_input" placeholder="1st Ability"></textarea>
      <!-- Ability 2 -->
      <div class="editor_input_bottom">
        <select id="single_role_ability2_type" class="editor_ability_icon"></select>
        <img id="single_role_ability2_icon" class="editor_ability_icon_preview">
        <textarea id="single_role_ability2_name" class="editor_input_name" placeholder="2nd Ability Name"></textarea>
      </div>
      <textarea id="single_role_ability2" class="editor_input" placeholder="2nd Ability"></textarea>

      <!-- Very Bottom Row -->
      <div class="editor_input_bottom_bottom">
        <!-- Activate Order Number Input -->
        <textarea id="single_role_activate" class="editor_input_activate"
          placeholder="Activate / Prompt Number"></textarea>
        <!-- Role Tags -->
        <label class="editor_tag">
          <input id="single_role_tag_friendly" type="checkbox" class="hidden">
          <img id="single_role_tag_friendly_icon"
            src="https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/tag_icons/friendly.png?raw=true"
            class="editor_tag_icon">
          <span>Friendly Guest Style</span>
        </label>
        <label class="editor_tag">
          <input id="single_role_tag_setup" type="checkbox" class="hidden">
          <img id="single_role_tag_setup_icon"
            src="https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/tag_icons/setup.png?raw=true"
            class="editor_tag_icon">
          <span>Affects Setup</span>
        </label>
        <label class="editor_tag">
          <input id="single_role_tag_preserve" type="checkbox" class="hidden">
          <img id="single_role_tag_preserve_icon"
            src="https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/tag_icons/preserve.png?raw=true"
            class="editor_tag_icon">
          <span>Preserves Game</span>
        </label>

      </div>
    </div>
  </main>

  <footer id="editor_footer" class="editor_footer">
    <p>v<span id="editor_footer_version" class="editor_footer_version"></span> | © 2026-<span id="editor_footer_year"
        class="editor_footer_year"></span> Gerk Harrington. All rights
      reserved.
    </p>
  </footer>

  <script>
    /* -------------------[ Site Data ]------------------- */
    /* Site version */
    const site_version = "0.15.0";

    /* Role type order */
    const sidebar_type_order = ["Guest", "Stranger", "Spirit", "Item", "Prompt"];

    /* Ability icon order */
    const editor_ability_icon_order = {
      none: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/none.png?raw=true",
      passive: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/passive.png?raw=true",
      passive_d: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/passive_d.png?raw=true",
      night: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/night.png?raw=true",
      night_d: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/night_d.png?raw=true",
      night_1: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/night_1.png?raw=true",
      night_2: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/night_2.png?raw=true",
      day: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/day.png?raw=true",
      day_d: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/day_d.png?raw=true",
      day_1: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/day_1.png?raw=true",
      day_2: "https://github.com/gerkharrington/the-apprentice-workshop/blob/main/assets/ability_icons/day_2.png?raw=true",
    };

    /* Ability icon names to display in the dropdown */
    const editor_ability_icon_labels = {
      none: "None",
      passive: "Passive",
      passive_d: "Passive (💀)",
      night: "Night",
      night_d: "Night (💀)",
      night_1: "Night (1)",
      night_2: "Night (2)",
      day: "Day",
      day_d: "Day (💀)",
      day_1: "Day (1)",
      day_2: "Day (2)"
    };

    /* Default role data */
    const site_roles_default = {
      /* id should never be left as default, always give each role a random id */
      id: "",
      /* Everything else here can be safely used as-is until the user modifies it */
      name: "Untitled",
      toplabel: "",
      ability1: "",
      ability2: "",
      ability1_icon: "none",
      ability2_icon: "none",
      ability1_name: "",
      ability2_name: "",
      icon: "",
      type: "Guest",
      activate: "",
      format: false,
      tag_friendly: false,
      tag_setup: false,
      tag_preserve: false
    };

    /* Calculate colours light */
    const colour_guest_hex = getComputedStyle(document.documentElement).getPropertyValue('--type_guest').trim().replace('#', '');
    const colour_guest = new Uint8Array([parseInt(colour_guest_hex.slice(0, 2), 16), parseInt(colour_guest_hex.slice(2, 4), 16), parseInt(colour_guest_hex.slice(4, 6), 16)]);

    /* -------------------[ Create & Render Sidebar ]------------------- */
    function sidebar_render() {
      const list = element_sidebar_list;
      list.innerHTML = "";

      /* Hierarchy for role sorting */
      const type_order = sidebar_type_order;
      data_roles_order();

      type_order.forEach(type => {
        const roles_of_type = data_roles
          .map((role, index) => ({ role, index }))
          .filter(item => (item.role.type || "Guest") === type);

        /* If no roles are of this role type, we don't render this category at all */
        if (roles_of_type.length === 0) return;

        /* Create header text for this role type category */
        const header = document.createElement("div");
        header.className = "sidebar_type";
        /* Add the little arrow to indicate when the category is collapsed */
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "▼";
        if (sidebar_collapsed[type]) {
          arrow.classList.add("collapsed");
        }
        header.appendChild(arrow);
        header.appendChild(document.createTextNode(" " + type));
        /* Code for clicking to collapse / uncollapse the section */
        header.onclick = () => {
          sidebar_collapsed[type] = !sidebar_collapsed[type];
          const arrow = header.querySelector(".arrow");
          arrow.classList.toggle("collapsed");
          setTimeout(() => {
            sidebar_render();
          }, 200);
        };
        list.appendChild(header);

        /* Don't render these roles if the section is collapsed */
        if (sidebar_collapsed[type]) return;

        /* Render all the roles in this category */
        roles_of_type.forEach(({ role, index }) => {
          const div = document.createElement("div");
          div.className = "sidebar_entry";

          /* Add classes for CSS */
          div.classList.add(`sidebar_type_${(role.type || "Guest").toLowerCase()}`);

          if (role.id === sidebar_selected) {
            div.classList.add("selected");
          }

          /* Delete button for this role */
          const sidebar_delete = document.createElement("button");
          sidebar_delete.textContent = "-";
          sidebar_delete.setAttribute("aria-label", "Delete Role");
          sidebar_delete.classList.add("sidebar_delete");
          sidebar_delete.onclick = (e) => {
            e.stopPropagation();
            if (!confirm("Delete this role?")) return;
            const element = e.target.closest(".sidebar_entry");
            data_roles_delete(element);
          };

          const container = document.createElement("div");
          container.className = "sidebar_container";

          /* Add the role icon display */
          if (role.icon) {
            const icon = document.createElement("img");
            icon.className = "sidebar_icon";
            icon.alt = `${role.name} Icon`;
            data_roles_icon_get(role, (src) => {
              if (src) icon.src = src;
            });
            container.appendChild(icon);
          }

          const name = document.createElement("span");
          name.textContent = role.name;
          name.className = "sidebar_name";

          /* This is the order of how everything displays in one sidebar slot */
          div.appendChild(sidebar_delete);
          div.appendChild(container);
          div.appendChild(name);

          /* Click this line to select this role */
          div.onclick = () => {
            sidebar_selected = role.id;
            sidebar_render();
            data_roles_load();
          };

          list.appendChild(div);
        });
      });
    }

    /* -------------------[ Generate Unique UUID ]------------------- */
    function data_roles_uuid() {

    }

    /* -------------------[ Load From Local Storage ]------------------- */
    function data_storage_load() {
      const saved = localStorage.getItem("data_storage");
      data_saved = true;
      if (saved) {
        try {
          data_roles = JSON.parse(saved);
        } catch (e) {
          data_roles = [];
        }
      }
    }

    /* -------------------[ Export As JSON ]------------------- */
    function data_export() {
      /* Creates the object to be included in the export */
      function create_export_role(role, icon_override = role.icon) {
        const export_role = {};
        /* Go through each piece of data to see if we need it exported (name, ability1, etc) */
        Object.keys(site_roles_default).forEach((key) => {
          /* Never export these pieces of information, they are not about the role itself and only used to help the editor function */
          if (key === "id" || key === "format") return;
          /* Get the formatted version of the icon, if needed */
          const value = key === "icon" ? icon_override : role[key];
          /* Compare with site_roles_default (we only need to export values that are not the default (ie, they have been changed by the user)) */
          if (value === site_roles_default[key]) return;
          /* If all checks pass, this is a value we will export */
          export_role[key] = value;
        });
        return export_role;
      }
      /* Convert role data into usable objects */
      const data_export_data = data_roles.map(role => {
        /* Get the correct value for exporting the icon */
        return new Promise((resolve) => {
          /* If there's no icon, or it's not being formatted, export normally */
          if (!role.icon || !role.format) {
            resolve(create_export_role(role));
            return;
          }
          /* Otherwise, format the icon before exporting */
          data_roles_format(role.icon, role.type, (formattedIcon) => {
            resolve(create_export_role(role, formattedIcon));
          });
        });
      });
      /* Wait for icon formatting to finish */
      Promise.all(data_export_data).then((data_roles_export) => {
        /* Make the JSON file */
        const url = URL.createObjectURL(new Blob([JSON.stringify(data_roles_export, null, 2)], { type: "application/json" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = "roles.json";
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    /* -------------------[ Import From JSON ]------------------- */
    function data_import(file) {
      if (!file) return;
      const sidebar_file_reader = new FileReader();
      sidebar_file_reader.onload = function (e) {
        try {
          /* Convert JSON data to a readable object s*/
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed)) { return; }
          if (parsed.length > 1000) { alert("Failed to load file! Please try another file.\nError B-5: Too many roles tried to load at once."); return; }
          /* Set all the data */
          data_roles = parsed.map(role => ({
            /* Might swap to "structuredClone" instead of "JSON.parse(JSON.stringify" in the future */
            ...JSON.parse(JSON.stringify(site_roles_default)),
            id: data_roles_uuid(),
            ...role
          }));
          /* Load everything else (now role data is donw) */
          sidebar_selected = data_roles.length ? data_roles[0].id : null;
          data_saved = false;
          data_roles_icon_cache.clear();
          sidebar_render();
          sidebar_render_save();
          if (sidebar_selected) {
            data_roles_load();
          } else {
            editor_clear();
          }
        } catch (err) {
          alert("Failed to load file! Please try another file.\nError B-4: File JSON is invalid.");
        }
      };
      sidebar_file_reader.readAsText(file);
    }

    /* -------------------[ Add New Role ]------------------- */
    function data_roles_add() {
      /* Choose what type the role will be created as (guest by default) */
      const default_role_type = sidebar_selected !== null ? (data_roles.find(r => r.id === sidebar_selected)?.type || "Guest") : "Guest";
      /* This adds the actual role with all default data */
      data_roles.push({
        /* Might swap to "structuredClone" instead of "JSON.parse(JSON.stringify" in the future */
        ...JSON.parse(JSON.stringify(site_roles_default)),
        id: data_roles_uuid(),
        type: default_role_type
      });
      sidebar_selected = data_roles[data_roles.length - 1].id;
      sidebar_render();
      data_saved = false;
      sidebar_render_save();
      data_roles_load();
    }

    /* -------------------[ Delete Role ]------------------- */
    function data_roles_delete(element) {
      if (!element) return;
      const on_transition_end = (e) => {
        if (e.propertyName !== "opacity") return;
        element.removeEventListener("transitionend", on_transition_end);
        /* Store the index of the role we deleted */
        const deleted = data_roles.findIndex(r => r.id === sidebar_selected);
        /* Properly delete the role after the animation plays */
        data_roles = data_roles.filter(r => r.id !== sidebar_selected);
        /* Select a new role */
        if (data_roles.length === 0) {
          sidebar_selected = null;
        } else {
          sidebar_selected = data_roles[Math.max(0, deleted - 1)]?.id || data_roles[0].id;
        }
        /* Re-render and set some variables */
        sidebar_render();
        data_saved = false;
        sidebar_render_save();
        data_roles_load();
      };
      element.addEventListener("transitionend", on_transition_end);
      element.classList.add("removing");
    }

    /* -------------------[ Handle File Reader For Image Upload ]------------------- */
    function editor_icon_upload(file, onSuccess) {
      /* Initial error checks */
      if (!file) { alert("Failed to load file! Please try another file.\nError A-1: No file uploaded."); return; }
      if (!file.type) { alert("Failed to load file! Please try another file.\nError B-1: File type data not found."); return; }
      if (!file.type.startsWith("image/")) { alert("Failed to load file! Please try another file.\nError B-2: Not a valid image file type."); return; }
      if (file.size > 4 * 1024 * 1024) { alert("Failed to load file! Please try another file.\nError B-3: File size is dangerously large (>4MB)."); return; }
      /* Create the file reader */
      const editor_file_reader = new FileReader();
      editor_file_reader.onload = function (e) {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.src = e.target.result;
        image.onerror = function () { alert("Failed to load file! Please try another file.\nError A-3: Unknown - browser failed to decode image.."); };
        image.onload = function () {
          /* Define the size (widht / height) of the converted image */
          const target_size = 1024;
          /* Create our canvas */
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = target_size;
          canvas.height = target_size;
          /* Fill the background (important for transparency images) */
          ctx.clearRect(0, 0, target_size, target_size);
          /* Crop the image to square */
          const size = Math.min(image.width, image.height);
          const sx = (image.width - size) / 2;
          const sy = (image.height - size) / 2;
          /* Draw the image, scaled to target_size */
          ctx.drawImage(image, sx, sy, size, size, 0, 0, target_size, target_size);
          const croppedDataUrl = canvas.toDataURL("image/webp");
          onSuccess(croppedDataUrl);
        }
      };
      /* File reader error message */
      editor_file_reader.onerror = function () {
        alert("Failed to load file! Please try another file.\nError A-2: Unknown - browser failed to read file.");
      };
      editor_file_reader.readAsDataURL(file);
    }

    /* -------------------[ Show / Hide Stuff For Icon Upload ]------------------- */
    function editor_icon_update(icon) {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      /* Check if we don't have an icon */
      if (!icon) {
        element_editor_icon_preview.src = "";
        element_editor_icon_preview.style.display = "none";
        element_editor_icon_placeholder.style.display = "block";
        element_editor_icon_upload.classList.remove("has_icon");
        return;
      }
      /* Format the icon */
      if (role.format) {
        data_roles_format(icon, role.type, (newIcon) => {
          element_editor_icon_preview.src = newIcon;
        });
      } else {
        element_editor_icon_preview.src = icon;
      }
      /* Display stuff */
      element_editor_icon_preview.style.display = "block";
      element_editor_icon_placeholder.style.display = "none";
      element_editor_icon_upload.classList.add("has_icon");
    }

    /* -------------------[ Check To Enable / Disable Ability Input Boxes ]------------------- */
    function editor_enable_check() {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      /* Role type */
      const is_item = role.type === "Item";
      const is_prompt = role.type === "Prompt";
      const is_stranger = role.type === "Stranger";
      /* Disable ability text if type is set to "none" */
      const is_ability1_none = element_single_role_ability1_type.value === "none";
      const is_ability2_none = element_single_role_ability2_type.value === "none";
      /* Disable ability icons for items */
      const ability1_icon_disabled = is_item || is_prompt;
      const ability2_icon_disabled = is_item || is_prompt;
      /* Disable text inputs if icon is set to "none" and it's possible to change */
      const ability1_disabled = !ability1_icon_disabled && is_ability1_none;
      const ability2_disabled = !ability2_icon_disabled && is_ability2_none;
      /* Apply disabled & enabled states */
      element_single_role_ability1.disabled = ability1_disabled || is_prompt;
      element_single_role_ability2.disabled = ability2_disabled || is_prompt;
      element_single_role_ability1_type.disabled = ability1_icon_disabled;
      element_single_role_ability2_type.disabled = ability2_icon_disabled;
      element_single_role_ability1_icon.classList.toggle("disabled", ability1_icon_disabled || is_ability1_none);
      element_single_role_ability2_icon.classList.toggle("disabled", ability2_icon_disabled || is_ability2_none);
      element_single_role_ability1_name.disabled = ability1_icon_disabled || is_ability1_none;
      element_single_role_ability2_name.disabled = ability2_icon_disabled || is_ability2_none;
      element_single_role_activate.disabled = is_item;
      element_single_role_toplabel.disabled = !(is_stranger || is_prompt);
      /* Role tags */
      element_single_role_tag_friendly.disabled = is_item || is_prompt;
      element_single_role_tag_setup.disabled = is_item || is_prompt;
      element_single_role_tag_preserve.disabled = is_item || is_prompt;
      element_single_role_tag_friendly.classList.toggle("disabled", is_item || is_prompt);
      element_single_role_tag_setup.classList.toggle("disabled", is_item || is_prompt);
      element_single_role_tag_preserve.classList.toggle("disabled", is_item || is_prompt);
    }

    /* -------------------[ Role Icon Formatting ]------------------- */
    function data_roles_format(imageSrc, roleType, callback) {
      const icon = new Image();
      icon.crossOrigin = "anonymous";
      icon.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = icon.width;
        canvas.height = icon.height;
        ctx.drawImage(icon, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        /* Role Colours */
        let base = colour_guest;
        if (roleType === "Stranger") base = colour_stranger;
        else if (roleType === "Spirit") base = colour_spirit;
        else if (roleType === "Item") base = colour_item;
        let base_dark = colour_guest_dark;
        if (roleType === "Stranger") base_dark = colour_stranger_dark;
        else if (roleType === "Spirit") base_dark = colour_spirit_dark;
        else if (roleType === "Item") base_dark = colour_item_dark;
        /* Start going through each pixel of the image */
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          /* Check if the pixel is transparent in any way (skip it) */
          if (data[i + 3] < 255) {
            data[i] = 0;
            data[i + 1] = 0;
            data[i + 2] = 0;
            data[i + 3] = 0;
            continue;
          }
          /* Calculate brightness. 0 = dark, 1 = light */
          const brightness = (r + g + b) / (255 * 3);
          const target = brightness > 0.55 ? base : base_dark;
          data[i] = target[0];
          data[i + 1] = target[1];
          data[i + 2] = target[2];
          data[i + 3] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
        callback(canvas.toDataURL("image/webp"));
      };
      icon.src = imageSrc;
    }

    /* -------------------[ Get Proper Icon (Formatted Or Not) ]------------------- */
    function data_roles_icon_get(role, callback) {
      if (!role.icon) return callback(null);
      const key = role.id + "_" + role.format + "_" + role.type;
      if (data_roles_icon_cache.has(key)) {
        callback(data_roles_icon_cache.get(key));
        return;
      }
      if (!role.format) {
        callback(role.icon);
        return;
      }
      data_roles_format(role.icon, role.type, (result) => {
        data_roles_icon_cache.set(key, result);
        callback(result);
      });
    }

    /* -------------------[ Sort data_roles By Order ]------------------- */
    function data_roles_order() {
      const type_order = sidebar_type_order;
      const result = [];
      type_order.forEach(type => {
        data_roles.forEach(role => {
          if ((role.type || "Guest") === type) {
            result.push(role);
          }
        });
      });
      data_roles = [...result];
    }

    /* -------------------[ Event Listeners ]------------------- */
    /* Changing role name */
    element_single_role_name.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      if (this.value.trim() === "") {
        data_roles.find(r => r.id === sidebar_selected).name = site_roles_default.name;
      } else {
        const role = data_roles.find(r => r.id === sidebar_selected);
        if (!role) return;
        role.name = this.value;
      }
      sidebar_render();
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing activate order number */
    element_single_role_activate.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.activate = this.value;
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing win condition */
    element_single_role_toplabel.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.toplabel = this.value;
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing ability 1 */
    element_single_role_ability1.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.ability1 = this.value;
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing ability 2 */
    element_single_role_ability2.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.ability2 = this.value;
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing image icon */
    element_single_role_icon.addEventListener("change", function () {
      if (sidebar_selected === null) return;
      const file = this.files[0];
      editor_icon_upload(file, (icon) => {
        const role = data_roles.find(r => r.id === sidebar_selected);
        if (!role) return;
        role.icon = icon;
        editor_icon_update(icon);
        sidebar_render();
        data_saved = false;
        sidebar_render_save();
      });
    });

    /* Changing role type */
    element_single_role_type.addEventListener("change", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      /* Change the actual type value */
      role.type = this.value;
      /* Clear formatted icon cache */
      for (const key of data_roles_icon_cache.keys()) {
        if (key.startsWith(role.id + "_")) {
          data_roles_icon_cache.delete(key);
        }
      }
      /* Update everything else */
      editor_icon_update(role.icon);
      sidebar_render();
      data_saved = false;
      sidebar_render_save();
      /* Update input and textarea highlight colour */
      let colour = getComputedStyle(document.documentElement).getPropertyValue("--type_guest").trim();
      if (role.type === "Stranger") {
        colour = getComputedStyle(document.documentElement).getPropertyValue("--type_stranger").trim();
      } else if (role.type === "Spirit") {
        colour = getComputedStyle(document.documentElement).getPropertyValue("--type_spirit").trim();
      } else if (role.type === "Item") {
        colour = getComputedStyle(document.documentElement).getPropertyValue("--type_item").trim();
      }
      document.documentElement.style.setProperty("--type_selected", colour);
      let colour_dark = getComputedStyle(document.documentElement).getPropertyValue("--type_guest_dark").trim();
      if (role.type === "Stranger") {
        colour_dark = getComputedStyle(document.documentElement).getPropertyValue("--type_stranger_dark").trim();
      } else if (role.type === "Spirit") {
        colour_dark = getComputedStyle(document.documentElement).getPropertyValue("--type_spirit_dark").trim();
      } else if (role.type === "Item") {
        colour_dark = getComputedStyle(document.documentElement).getPropertyValue("--type_item_dark").trim();
      }
      document.documentElement.style.setProperty("--type_selected_dark", colour_dark);
      editor_enable_check();
    });

    /* Changing ability 1 icon */
    element_single_role_ability1_type.addEventListener("change", function () {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.ability1_icon = this.value;
      element_single_role_ability1_icon.src = editor_ability_icon_order[this.value];
      editor_enable_check();
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing ability 2 icon */
    element_single_role_ability2_type.addEventListener("change", function () {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.ability2_icon = this.value;
      element_single_role_ability2_icon.src = editor_ability_icon_order[this.value];
      editor_enable_check();
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing ability 1 name */
    element_single_role_ability1_name.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.ability1_name = this.value;
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing ability 2 name */
    element_single_role_ability2_name.addEventListener("input", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.ability2_name = this.value;
      data_saved = false;
      sidebar_render_save();
    });

    /* Changing role tags */
    element_single_role_tag_friendly.addEventListener("change", function () {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.tag_friendly = this.checked;
      data_saved = false;
      sidebar_render_save();
    });
    element_single_role_tag_setup.addEventListener("change", function () {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.tag_setup = this.checked;
      data_saved = false;
      sidebar_render_save();
    });
    element_single_role_tag_preserve.addEventListener("change", function () {
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.tag_preserve = this.checked;
      data_saved = false;
      sidebar_render_save();
    });

    /* Makes the "Add Role" button clickable to add a new role */
    element_sidebar_add.addEventListener("click", data_roles_add);

    /* Makes the "Save" button clickable to save all data to local storage */
    element_sidebar_save.addEventListener("click", () => {
      localStorage.setItem("data_storage", JSON.stringify(data_roles));
      data_saved = true;
      sidebar_render_save();
    });

    /* Makes the icon in the editor clickable to upload a different one */
    element_editor_icon_upload.addEventListener("click", () => { element_single_role_icon.click(); });

    /* Makes the export button clickable to export a JSON file */
    element_sidebar_export.addEventListener("click", data_export);

    /* Makes the import button clickable to load a JSON file (it technically "clicks" the hidden file upload area) */
    element_sidebar_import.addEventListener("click", () => {
      if (confirm("This will override all current data. Continue?")) { element_sidebar_import_file.click(); }
    });

    /* Checks the hidden import file upload area for importing a JSON (indirectly "clicked" by the import button) */
    element_sidebar_import_file.addEventListener("change", function () {
      const file = this.files[0];
      data_import(file);
      this.value = "";
    });

    /* Makes the button clickable to toggle role formatting */
    element_single_role_format.addEventListener("click", function () {
      if (sidebar_selected === null) return;
      const role = data_roles.find(r => r.id === sidebar_selected);
      if (!role) return;
      role.format = !role.format;
      this.classList.toggle("on", role.format);
      editor_icon_update(role.icon);
      sidebar_render();
      data_saved = false;
      sidebar_render_save();
    });

    /* -------------------[ Drag & Drop Icons ]------------------- */
    /* Event listeners for all drag & drop related actions */
    ["dragenter", "dragover", "dragleave", "drop"].forEach(event => {
      element_editor_icon_upload.addEventListener(event, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });
    /* The actual code for uploading a file through drag & drop */
    element_editor_icon_upload.addEventListener("drop", (e) => {
      if (sidebar_selected === null) return;
      const file = e.dataTransfer.files[0];
      editor_icon_upload(file, (icon) => {
        const role = data_roles.find(r => r.id === sidebar_selected);
        if (!role) return;
        role.icon = icon;
        editor_icon_update(icon);
        sidebar_render();
        data_saved = false;
        sidebar_render_save();
      });
    });

    /* -------------------[ Unsaved Changes Warning ]------------------- */
    window.addEventListener("beforeunload", function (e) {
      if (!data_saved) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    /* -------------------[ Keyboard Shortcuts ]------------------- */
    window.addEventListener("keydown", function (e) {
      /* Detect keys (Windows "Ctrl" and Mac "command") */
      const key_ctrl = e.ctrlKey || e.metaKey;

      /* Ctrl + S (Save data) */
      if (key_ctrl && e.key.toLowerCase() === "s") {
        e.preventDefault();
        element_sidebar_save.click();
        return;
      }

      /* Ctrl + Enter (Add new role) */
      if (key_ctrl && e.key.toLowerCase() === "enter") {
        e.preventDefault();
        data_roles_add();
        return;
      }

      /* Ctrl + Delete (Delete role) */
      if (key_ctrl && (e.key.toLowerCase() === "delete" || e.key.toLowerCase() === "backspace")) {
        e.preventDefault();
        if (sidebar_selected === null) return;
        const role = data_roles.find(r => r.id === sidebar_selected);
        if (!role) return;
        const element = document.querySelector(".sidebar_entry.selected");
        if (element) {
          element.classList.add("removing");
        }
        data_roles_delete(element);
        return;
      }

      /* Ctrl + Up (Move role upwards in list) */
      if (key_ctrl && e.key.toLowerCase() === "arrowup") {
        e.preventDefault();
        if (sidebar_selected === null) return;
        const index = data_roles.findIndex(r => r.id === sidebar_selected);
        if (index <= 0) return;
        [data_roles[index - 1], data_roles[index]] = [data_roles[index], data_roles[index - 1]];
        sidebar_render();
        data_saved = false;
        sidebar_render_save();
        return;
      }

      /* Ctrl + Down (Move role downwards in list) */
      if (key_ctrl && e.key.toLowerCase() === "arrowdown") {
        e.preventDefault();
        if (sidebar_selected === null) return;
        const index = data_roles.findIndex(r => r.id === sidebar_selected);
        if (index === -1 || index >= data_roles.length - 1) return;
        [data_roles[index + 1], data_roles[index]] = [data_roles[index], data_roles[index + 1]];
        sidebar_render();
        data_saved = false;
        sidebar_render_save();
        return;
      }

      /* Ctrl + D (Duplicate role) */
      if (key_ctrl && e.key.toLowerCase() === "d") {
        e.preventDefault();
        const role = data_roles.find(r => r.id === sidebar_selected);
        if (!role) return;
        const clone = JSON.parse(JSON.stringify(role));
        clone.id = data_roles_uuid();
        /* Count existing copies */
        const copy_matches_regular = role.name.match(/(?: Copy)+$/);
        const copy_count_regular = copy_matches_regular ? (copy_matches_regular[0].match(/ Copy/g) || []).length : 0;
        /* Funny Easter egg */
        if (copy_count_regular >= 5) {
          clone.name = role.name.replace(/(?: Copy)+$/, "") + " Super Copy";
        } else {
          clone.name = role.name + " Copy";
        }
        const index = data_roles.findIndex(r => r.id === sidebar_selected);
        data_roles.splice(index + 1, 0, clone);
        sidebar_selected = clone.id;
        sidebar_render();
        data_roles_load();
        data_saved = false;
        sidebar_render_save();
      }

      /* Slash (Focus on role name input) */
      if (e.key === "/" && !key_ctrl && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        element_single_role_name.focus();
      }

      /* Number 1 (Focus on ability1 input) */
      if (e.key === "1" && !key_ctrl && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        element_single_role_ability1.focus();
      }

      /* Number 2 (Focus on ability2 input) */
      if (e.key === "2" && !key_ctrl && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        element_single_role_ability2.focus();
      }

    });

    /* -------------------[ Initiate Editor (This Runs On Page Load) ]------------------- */
    /* Add the relevant data to the footer */
    element_editor_footer_year.textContent = new Date().getFullYear();
    element_editor_footer_version.textContent = site_version;
    editor_ability_icon_init(element_single_role_ability1_type);
    editor_ability_icon_init(element_single_role_ability2_type);
    data_storage_load();
    if (data_roles.length === 0) {
      editor_clear();
    } else {
      sidebar_selected = data_roles[0].id;
      data_roles_load();
    }
    sidebar_render();
    sidebar_render_save();

  </script>

</body>

</html>
