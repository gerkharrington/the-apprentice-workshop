<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Apprentice Workshop</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <!-- Discord embed -->
  <meta property="og:title" content="⚒️ The Apprentice Workshop" />
  <meta property="og:description"
    content="A site for creating custom The Grandest Party content. Create & export custom roles with an easy-to-use, all-in-one tool!" />
  <meta property="og:image" content="assets/favicon.png" />
  <meta property="og:url" content="https://gerkharrington.github.io/the-apprentice-workshop/" />
  <meta property="og:type" content="website" />

  <!-- CSS styles -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <aside id="sidebar_main" class="sidebar_main">
    <!-- The top of the list -->
    <button id="sidebar_project" class="sidebar_add">Project Details</button>
    <input id="sidebar_search" class="sidebar_search" placeholder="Search..." />
    <!-- The sidebar list itself -->
    <div id="sidebar_list" class="sidebar_list"></div>
    <!-- Add role button -->
    <button id="sidebar_add" class="sidebar_add">+ Add Role / Card</button>
    <!-- Save button -->
    <button id="sidebar_save" class="sidebar_add">Save</button>
    <!-- The undo / redo row -->
    <div class="sidebar_io_row">
      <button id="sidebar_undo" class="sidebar_add">↩ Undo</button>
      <button id="sidebar_redo" class="sidebar_add">↪ Redo</button>
    </div>
  </aside>

  <!-- Sidebar toggle button -->
  <button id="sidebar_toggle" class="sidebar_toggle">𑁔</button>

  <main id="editor_main" class="editor_main">

    <!-- Page header -->
    <h2>The Apprentice Workshop</h2>

    <!-- Project Metadata Page -->
    <div id="editor_project" class="hidden">
      <input id="editor_project_icon_input" class="fake_hidden" type="file" accept="image/*">
      <div class="editor_input_top">
        <div id="editor_project_icon_upload" class="editor_icon_upload">
          <img id="editor_project_icon_preview" class="editor_icon_preview" alt="Project icon">
          <span id="editor_project_icon_placeholder" class="editor_icon_placeholder">+</span>
        </div>
        <div class="editor_input_top_right">
          <input id="editor_project_name" class="editor_input_name" type="text" placeholder="Project Name">
          <input id="editor_project_author" class="editor_input_name" type="text" placeholder="Project Author">
        </div>
      </div>
      <textarea id="editor_project_description" class="editor_input" placeholder="Project Description"></textarea>

      <!-- Bottom Row Buttons -->
      <div>
        <!-- Export Options-->
        <button id="editor_project_export_cards" class="editor_button editor_project_button">Export Card Images</button>
        <button id="editor_project_export_sheet" class="editor_button editor_project_button">Export Scenario
          Sheet</button>
        <button id="editor_project_export_json" class="editor_button editor_project_button">Export JSON</button>
        <!-- Import Options -->
        <button id="editor_project_import_json" class="editor_button editor_project_button">Import JSON</button>
        <input id="editor_project_import_json_file" type="file" accept="application/json" class="fake_hidden">
      </div>
    </div>

    <div id="editor_input" class="hidden">

      <!-- Role Icon Input (Only For Screen Readers) -->
      <input id="single_role_icon" class="fake_hidden" type="file" accept="image/*">

      <div class="editor_input_top">

        <!-- Role Icon Preview & Clickable Area -->
        <div id="editor_icon_upload" class="editor_icon_upload">
          <img id="editor_icon_preview" class="editor_icon_preview" alt="Selected role icon">
          <span id="editor_icon_placeholder" class="editor_icon_placeholder">+</span>
        </div>

        <!-- Right Side (Next To Icon Upload)-->
        <div class="editor_input_top_right">

          <!-- Right Side - Top Row -->
          <div class="editor_input_top_right_top">
            <!-- Role Icon Formatting Toggle -->
            <button id="single_role_format" class="editor_format editor_button">Format Icon</button>
          </div>

          <!-- Right Side - Bottom Row -->
          <div class="editor_input_top_right_bottom">
            <!-- Role Name Input -->
            <div class="editor_name_container">
            <div id="editor_marker" class="editor_marker">★ Vanilla roles should not be edited</div>
            <label for="single_role_name" class="fake_hidden">Role Name Input</label>
            <input id="single_role_name" class="editor_input_name" placeholder="Role Name" type="text">
            </div>
            <!-- Role Type Input -->
            <select id="single_role_type">
              <option value="Guest">Guest</option>
              <option value="Stranger">Stranger</option>
              <option value="Spirit">Spirit</option>
              <option value="Item">Item</option>
              <option value="Prompt">Prompt</option>
            </select>
          </div>

        </div>

      </div>

      <textarea id="single_role_toplabel" class="editor_input_toplabel"
        placeholder="Win Condition / Prompt Card Label"></textarea>

      <!-- Ability Inputs -->
      <!-- Ability 1 -->
      <div class="editor_input_bottom">
        <select id="single_role_ability1_type" class="editor_ability_icon"></select>
        <img id="single_role_ability1_icon" class="editor_ability_icon_preview">
        <textarea id="single_role_ability1_name" class="editor_input_name" placeholder="1st Ability Name"></textarea>
      </div>
      <textarea id="single_role_ability1" class="editor_input" placeholder="1st Ability"></textarea>
      <!-- Ability 2 -->
      <div class="editor_input_bottom">
        <select id="single_role_ability2_type" class="editor_ability_icon"></select>
        <img id="single_role_ability2_icon" class="editor_ability_icon_preview">
        <textarea id="single_role_ability2_name" class="editor_input_name" placeholder="2nd Ability Name"></textarea>
      </div>
      <textarea id="single_role_ability2" class="editor_input" placeholder="2nd Ability"></textarea>

      <!-- Very Bottom Row -->
      <div class="editor_input_bottom_bottom">
        <!-- Activate Order Number Input -->
        <textarea id="single_role_activate" class="editor_input_activate"
          placeholder="Activate / Prompt Number"></textarea>
        <!-- Role Tags -->
        <label class="editor_tag">
          <input id="single_role_tag_friendly" type="checkbox" class="fake_hidden">
          <img id="single_role_tag_friendly_icon" src="assets/tag_icons/friendly.png" class="editor_tag_icon">
          <span>Friendly Guest Style</span>
        </label>
        <label class="editor_tag">
          <input id="single_role_tag_setup" type="checkbox" class="fake_hidden">
          <img id="single_role_tag_setup_icon" src="assets/tag_icons/setup.png" class="editor_tag_icon">
          <span>Affects Setup</span>
        </label>
        <label class="editor_tag">
          <input id="single_role_tag_preserve" type="checkbox" class="fake_hidden">
          <img id="single_role_tag_preserve_icon" src="assets/tag_icons/preserve.png" class="editor_tag_icon">
          <span>Preserves Game</span>
        </label>

      </div>
    </div>
  </main>

  <!-- Custom Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal_box">
      <div id="modal_message" class="modal_message"></div>
      <!-- Add Role / Card -->
      <div id="modal_add_role" class="modal_add_role hidden">
        <div class="modal_add_role_buttons modal_button">
          <button id="modal_new_role">New Role</button>
          <button id="modal_load_vanilla">Load Vanilla Role</button>
        </div>
      </div>
      <!-- Vanilla Role Selector -->
      <div id="modal_vanilla_select_container" class="modal_vanilla_select_container hidden">
        <img id="modal_vanilla_icon" class="modal_vanilla_icon" src="" alt="">
        <select id="modal_vanilla_select" class="modal_vanilla_select"></select>
      </div>
      <div class="modal_button">
        <button id="modal_cancel">Cancel</button>
        <button id="modal_ok">✓ Okay</button>
      </div>
    </div>
  </div>

  <footer id="editor_footer" class="editor_footer">
    <p>v<span id="editor_footer_version" class="editor_footer_version"></span> | © 2026-<span id="editor_footer_year"
        class="editor_footer_year"></span>. All rights reserved.
    </p>
  </footer>

  <!-- Download JSZip and FileSaver.js -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- JavaScript Code -->
  <script src="script.js"></script>

</body>

</html>
